[package]
name = "tetrus"
version = "0.1.0"
edition = "2021"
description = "A fast, cross-platform terminal-based Tetris game built in Rust with Ratatui."
repository = "https://github.com/JoseIgnacioGC/tetrus"
license = "MIT"
readme = "README.md"
keywords = ["tetris", "game", "tui", "ratatui", "terminal"]
categories = ["games", "command-line-utilities"]

[[bin]]
name = "tetrus"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
crossterm = "0.29.0"
rand = "0.10.2"
ratatui = "0.30.2"
strum = { version = "0.28.0", features = ["derive"] }
tachyonfx = "0.25.1"

[features]
vhs = []
